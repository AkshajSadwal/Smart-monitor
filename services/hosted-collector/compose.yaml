services:
  hosted:
    build:
      context: ../..
      dockerfile: services/hosted-collector/Dockerfile
    environment:
      HOSTED_MODE: ${HOSTED_MODE:-disabled}
      HOSTED_CLIENT_LIMIT: ${HOSTED_CLIENT_LIMIT:-500}
      HOSTED_TOKEN_TTL_HOURS: ${HOSTED_TOKEN_TTL_HOURS:-720}
      HOSTED_TOPIC_LIMIT: ${HOSTED_TOPIC_LIMIT:-200}
      HOSTED_INTERVAL_SECONDS: ${HOSTED_INTERVAL_SECONDS:-300}
      HOSTED_RETENTION_HOURS: ${HOSTED_RETENTION_HOURS:-24}
    volumes:
      - hosted-data:/data
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
  proxy:
    image: caddy:2-alpine
    environment:
      HOSTED_DOMAIN: ${HOSTED_DOMAIN:-monitor.example.com}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [backend]
    depends_on: [hosted]
    restart: unless-stopped
networks:
  backend:
volumes:
  hosted-data:
  caddy-data:
  caddy-config:
